name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app (NSIS + MSI)
        run: bun run tauri build --bundles nsis,msi

      - name: Collect release files
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path "$out\portable" | Out-Null
          Copy-Item "src-tauri\target\release\ch-rzl-edit.exe" "$out\portable\ch-rzl-edit.exe"
          Copy-Item "README.md" "$out\portable\README.md"
          Compress-Archive -Path "$out\portable\*" -DestinationPath "$out\ch-rzl-edit_${tag}_windows-x64-portable.zip" -Force
          Copy-Item "src-tauri\target\release\bundle\nsis\*.exe" "$out\"
          Copy-Item "src-tauri\target\release\bundle\msi\*.msi" "$out\"
          Get-ChildItem $out -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash *$($_.Name)"
          } | Set-Content "$out\SHA256SUMS.txt"
          Get-ChildItem $out -File | Format-Table Name,Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ch-rzl-edit-windows-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ch-rzl-edit ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*

